<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGISTRO DE TAR Y ACTUALIZACIONES</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ================= ACCESO (cubre la app hasta validar la sesión) ================= -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <div id="authVerificando">
        <div class="loader-spinner"></div>
        <p style="color:var(--text-muted); margin:0;">Verificando sesión...</p>
      </div>

      <div id="authLogin" style="display:none;">
        <h3>Acceso restringido</h3>
        <p style="font-size:14px; color:var(--text-muted); margin-top:0;">Solo usuarios con rol ADMIN o RESP.</p>
        <input type="text" id="authUsuario" placeholder="Usuario" autocomplete="username">
        <input type="password" id="authPassword" placeholder="Contraseña" autocomplete="current-password">
        <button class="btn btn-primary" id="btnAuthEntrar" onclick="iniciarSesionLocal()">Entrar</button>
        <div class="auth-msg" id="authMsg"></div>
      </div>

      <div id="authBloqueado" style="display:none;">
        <h3>Acceso no disponible</h3>
        <p id="authBloqueadoMsg" style="font-size:14px; color:var(--text-muted);"></p>
        <button class="btn btn-secondary" onclick="iniciarAutenticacion()">Volver a intentar</button>
      </div>
    </div>
  </div>

  <!-- ================= APP: los módulos inyectan aquí su pestaña y su panel ================= -->
  <div class="container" id="appContainer" style="display:none;">
    <h2>REGISTRO Y ACTUALIZACIONES</h2>
    <div class="tabs" id="tabs"></div>
    <div id="modulos"></div>
  </div>

  <!-- ================= MODAL GLOBAL ================= -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h3 id="modalTitle">Confirmar Acción</h3>
      <div id="modalLoader" class="loader-spinner"></div>
      <p id="modalMessage">Procesando solicitud...</p>

      <!-- Contraseña obligatoria antes de escribir en la base -->
      <div class="modal-password" id="modalPasswordBox" style="display:none;">
        <label for="modalPassword">Confirma tu contraseña para continuar</label>
        <input type="password" id="modalPassword" placeholder="Contraseña" autocomplete="current-password">
        <div class="err" id="modalPasswordError"></div>
      </div>

      <div class="modal-buttons" id="modalButtonsConfirm" style="display:none;">
        <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
        <button class="btn" id="btnAceptarModal" onclick="ejecutarSincronizacion()">Aceptar y Enviar</button>
      </div>
      <div class="modal-buttons" id="modalButtonsClose" style="display:none;">
        <button class="btn btn-secondary" onclick="cerrarModal()">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Orden de carga: configuración -> utilidades -> núcleo -> módulos -> arranque -->
  <script src="config.js"></script>

  <script src="js/utils.js"></script>
  <script src="js/modulos.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/registro-bloque.js"></script>

  <script src="modules/mod-registro-manual.js"></script>
  <script src="modules/mod-registro-excel.js"></script>
  <script src="modules/mod-actualizar-estatus.js"></script>

  <script src="js/app.js"></script>

</body>
</html>
